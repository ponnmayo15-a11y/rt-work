# CT認定技師 単位認定講習会リサーチ 設定ファイル
# 値を変えるだけでフィルタ条件をチューニングできます。

# 日本X線CT専門技師認定機構「単位認定講習会等一覧」の最新分ページ
# (満杯になると tani_nintei_list/501.html のような過去ログに切り出され、
#  このURLには常に直近の新着分だけが載り続ける)
credit_list_index_url: "https://www.ct-ninteikikou.jp/nintei/tani_nintei_list/"

# 現在の認定期間の満了日(認定技師番号No.01743、2024年度更新対象より算出)。
# 「参加履歴」タブの残り日数カウントダウンに使用する。5年ごとに更新後の日付へ書き換えること。
renewal_period_end: "2030/03/31"

# オンライン講習の参加費上限(円)。この金額以下なら形式・地域を問わず採用する。
online_fee_max_yen: 1000

# オフライン講習を採用してよい都道府県
allowed_offline_prefectures:
  - "山梨県"
  - "東京都"
  - "静岡県"
  - "神奈川県"
  - "長野県"

# 平日夜でも可とする「地元」の都道府県(この県内のオフライン講習のみ平日18時以降開催もOK)
home_prefecture: "山梨県"
home_weekday_evening_start: "18:00"

# 採用対象をさらに絞り込む追加フィルタ(空リストなら制限なし)。スプレッドシートの「設定」タブから
# 変更できる。ここで絞り込んでも、大きな学会(major_conference_keywords)は対象外にならない。
category_filter: []
duration_filter: []
mode_filter: []
weekday_filter: []

# タイトルにこれらの語を含む講習会は、条件(オンライン/オフライン・費用・開催地・曜日)に関わらず
# 必ずリストに入れる(技師会・技術学会の大きな学会)
major_conference_keywords:
  - "学術大会"
  - "学術集会"
  - "臨床大会"
  - "総会"
  - "全国大会"

